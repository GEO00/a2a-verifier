# Prometheus scrape config for base-a2a-verifier
# Merge the scrape_configs entry into your existing prometheus.yml.
scrape_configs:
  - job_name: base-a2a-verifier
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: https
    static_configs:
      - targets:
          - a2a-verifier-production.up.railway.app
        labels:
          service: base-a2a-verifier
          network: base-mainnet

